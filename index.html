<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goose's Car Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100&display=swap" rel="stylesheet">
  <style>
  body {
      margin: 0;
  }
  h1 {
      color: white;
      text-align: center;
      width: 100%;
      font-family: Inter;
      font-weight: 110;
  }
  h2 {
      color: white;
      text-align: center;
      width: 100%;
      font-family: Inter;
      font-weight: 110;
      top: 80%;
      position: absolute;
      font-size:small
  }


  </style>
  
</head>
<body>
  <main>
  <header>
    <h1> Goose's Car Gallery</h1>
  </header>
  <div id = "catalog">
    <h2 id="carname"> 
    </h2>
    <p id = "description"></p>
    <dev class = "specs">
      <dev>
        <span>Engine</span>
        <span id = "engine"></span>
      </dev>

      <dev>
        <span>Power</span>
        <span id = "power"></span>
      </dev>

      <dev>
        <span>Top Speed</span>
        <span id = "topspeed"></span>
      </dev>

      <dev>
        <span>Zero to Hundred</span>
        <span id = "zerotohundred"></span>
      </dev>
      
      <dev>
        <span>Drivetrain</span>
        <span id = "drivetrain"></span>
      </dev>

      <dev>
        <span>Weight</span>
        <span id = "weight"></span>
      </dev>
    </dev>

  </div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
